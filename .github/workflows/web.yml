# Веб-версия Melete — рабочая, с ограниченными функциями, с любого телефона и компьютера (iPhone, Android, браузер):
# https://veracerkof-debug.github.io/melete-app/  (корень ветки gh-pages)
# Собирается при выпуске в pre. Это отдельная от APK версия: всё, что в браузере не работает (дорожки, текст песни, напоминания,
# папка Melete, «Звук телефона»…), в ней не показывается совсем — ни кнопок, ни заглушек (DECISIONS 2026-11-15). Данные — только
# в браузере (постоянное хранилище и service worker — src/core/webmemory.js, public/sw.js: работает без сети, ставится на главный экран).
# Витрина — полная копия dev с демонстрационным набором — собирается отдельно, из main (showcase.yml), по адресу …/melete-app/show/.
# Выкладка меняет только корень ветки gh-pages и не трогает show/ (build/pages-deploy.sh).
name: Web version (GitHub Pages)

on:
  push:
    branches: [pre] # веб-версия — для знакомства, как у тестеров: только из ветки pre (по слову автора «выпускай»), не из каждой отправки в main
    paths-ignore: ['**.md', 'docs/**', 'android/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Тесты
        run: npm test

      - name: Сборка
        env:
          MELETE_CHANNEL: pre # обычная веб-версия — как у тестеров: функции только для dev (пульт выступления и др.) в ней не показываются
        run: npx vite build --mode web

      - name: Выложить в gh-pages (корень; витрина show/ остаётся)
        env:
          PAGES_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: build/pages-deploy.sh dist root "Веб-версия: сборка ${{ github.run_number }} (${GITHUB_SHA::7}, ${GITHUB_REF_NAME})"
