# Версия для Linux (Tauri 2, WebKitGTK), те же два канала, что у Windows (src/core/update.js): main → релиз «dev»
# (Melete-Dev.AppImage и melete-dev.deb — отдельная программа «Melete DEV», tauri.dev.conf.json); ветка pre
# (по слову автора) → релиз «pre» (Melete.AppImage, melete.deb). Последней в релиз — метка linux-<номер>.ver.
# AppImage — один файл, запускается без установки и обновляется сам (src-tauri/src/update.rs); .deb ставит система
# (Ubuntu, Debian, Mint), обновляется новым пакетом. Сборка — на ubuntu-22.04: AppImage идёт и на системах новее.
# Модели компьютерной версии (текст песни, улучшенное разделение, ноты всех инструментов) — те же, что у Windows.
name: Linux (dev и pre)

on:
  push:
    branches: [main, pre] # как у Windows: ветки чатов не перетирают общие релизы
    paths-ignore: ['**.md', 'docs/**', 'android/**']
  workflow_dispatch:

permissions:
  contents: write

# Не отменять идущую сборку: Rust без кэша собирается долго, а в main пушат часто — иначе до конца не дойдёт ни
# одна. Идущая доделывается, из ждущих остаётся самая свежая
concurrency:
  group: linux-${{ github.ref_name }}
  cancel-in-progress: false

env:
  MELETE_CHANNEL: ${{ github.ref_name == 'pre' && 'pre' || 'dev' }}
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # WebKitGTK и всё для окна Tauri; cmake и clang — whisper.cpp; libfuse2 и file — сборщик AppImage;
      # GStreamer — WebKitGTK декодирует им звук и видео (decodeAudioData, медиатека), в AppImage кладётся с собой
      - name: Системные библиотеки
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf libfuse2 file cmake clang \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-pulseaudio

      - name: Зависимости
        run: npm ci

      - name: Тесты
        run: npm test

      - uses: actions/cache@v4
        with:
          path: |
            public/models
            src-tauri/models
          key: models-${{ runner.os }}-all-${{ hashFiles('build/models.json') }}
      # MODELS_ALL=1: модели «только для Windows» нужны и компьютерной версии на Linux
      - name: Модели
        run: npm run models
        env:
          MODELS_ALL: '1'

      - name: Сборка AppImage и .deb
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          if [ "$MELETE_CHANNEL" = dev ]; then npx tauri build --ci --bundles appimage,deb --config src-tauri/tauri.dev.conf.json; else npx tauri build --ci --bundles appimage,deb; fi

      - name: Переименовать
        run: |
          ls -la src-tauri/target/release/bundle/appimage/ src-tauri/target/release/bundle/deb/
          if [ "$MELETE_CHANNEL" = pre ]; then AI=Melete.AppImage; DEB=melete.deb; else AI=Melete-Dev.AppImage; DEB=melete-dev.deb; fi
          cp src-tauri/target/release/bundle/appimage/*.AppImage "$AI"
          chmod +x "$AI"
          cp src-tauri/target/release/bundle/deb/*.deb "$DEB"
          echo "AI=$AI" >> "$GITHUB_ENV"
          echo "DEB=$DEB" >> "$GITHUB_ENV"

      # файлы, затем метка сборки (последней — программа не предложит недокачанное)
      - name: Выложить в релиз канала
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$MELETE_CHANNEL
          if [ "$TAG" = pre ]; then TITLE="Melete 1.2 Pre-release"; else TITLE="Melete DEV"; fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --title "$TITLE" --notes "$(node build/whatsnew-notes.mjs $TAG ${{ github.run_number }} ${GITHUB_SHA::7})" --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "$AI" "$DEB" --clobber
          N=${{ github.run_number }}; echo "$N" > "linux-$N.ver"
          gh release upload "$TAG" "linux-$N.ver" --clobber
          for a in $(gh release view "$TAG" --json assets -q '.assets[].name' | grep -E '^linux-[0-9]+\.ver$'); do [ "$a" = "linux-$N.ver" ] || gh release delete-asset "$TAG" "$a" -y; done
