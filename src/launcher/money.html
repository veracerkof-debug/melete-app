<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Деньги — черновик</title>
<style>
:root{--l-sat:env(safe-area-inset-top,0px);--l-sab:env(safe-area-inset-bottom,0px);--bg:#F3F2EE;--cell:#FFFFFF;--ink:#161514;--l2:rgba(22,21,20,.62);--l3:rgba(22,21,20,.38);--sep:rgba(22,21,20,.10);
  --fill:rgba(22,21,20,.06);--fill2:rgba(22,21,20,.11);--tint:#E07A2E;--on-tint:#fff;--red:#C8483F;--green:#3C8F55;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121110;--cell:#1C1B19;--ink:#F3F2EE;--l2:rgba(243,242,238,.62);
  --l3:rgba(243,242,238,.36);--sep:rgba(243,242,238,.10);--fill:rgba(243,242,238,.07);--fill2:rgba(243,242,238,.13);
  --tint:#EE8A3C;--red:#E0675E;--green:#5DB477;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none}
body{display:flex;justify-content:center}
#app{width:100%;max-width:460px;height:calc(100dvh / var(--l-auto,1));position:relative;overflow:hidden;zoom:var(--l-auto,1)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.neg{color:var(--red)}.pos{color:var(--green)}

/* ── ввод ── */
.entry{position:absolute;inset:0;display:flex;flex-direction:column;padding:max(14px,var(--l-sat, 0px)) 16px max(14px,var(--l-sab, 0px))}
.top{display:flex;justify-content:space-between;align-items:center;min-height:40px;color:var(--l2);font-size:14px}
.top button{padding:10px 0;min-height:40px}
.top b{color:var(--ink);font-weight:600}
.top .lockbtn{width:40px;display:flex;justify-content:flex-end;color:var(--l2)}
.top .back{font-size:26px;width:40px;text-align:left;color:var(--l2)}
.top .back+button{flex:1;text-align:left}
.ebar{display:block;width:100%;height:14px;padding:5px 0;margin:-2px 0 4px}
.ebar i{display:block;height:4px;border-radius:2px;background:var(--tint)}
.ebar{background:linear-gradient(var(--fill2),var(--fill2)) center/100% 4px no-repeat}
.ebar i.over{background:var(--red)}
.kindseg{align-self:center;margin:6px 0 10px}
.cats.grid{flex:1;overflow-y:auto;align-content:start;margin:0 -16px;padding:2px 16px 16px;grid-auto-rows:76px}
.cats.grid .cat{height:auto;font-size:13.5px;padding:8px 6px;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.padhead{display:flex;justify-content:space-between;align-items:center;margin:2px 0 4px}
.padcat{font-size:18px;font-weight:600;display:inline-flex;align-items:center;gap:10px}
.sheet .amt{text-align:center;margin:14px 0 18px}
.btn.save{width:100%;margin-top:8px;height:54px;font-size:17px}
.amount{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:120px;gap:10px}
.amt{font-size:clamp(44px,13vw,64px);font-weight:300;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.amt .cur{font-size:.36em;color:var(--l3);margin-left:.25em;letter-spacing:0}
.amt.empty{color:var(--l3)}
.amt.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.seg{display:inline-flex;background:var(--fill);border-radius:12px;padding:3px}
.seg button{padding:7px 16px;border-radius:9px;font-size:14px;color:var(--l2);min-height:34px}
.seg button.on{background:var(--cell);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.quick{display:flex;gap:8px;overflow-x:auto;min-height:40px;margin:4px -16px 8px;padding:0 16px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:1px solid var(--sep);border-radius:20px;padding:0 14px;height:38px;font-size:14px;white-space:nowrap}
.quick button span.num{color:var(--l2)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.cat{height:52px;border-radius:14px;background:var(--cell);font-size:15px;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;padding:0 8px;text-align:center;line-height:1.1;user-select:none;-webkit-user-select:none}
.cat{flex-direction:column;gap:5px}
.cat .ic{width:24px;height:24px;color:var(--c);flex:none}
.cat .cn{max-width:100%}
.cat.more .ic{color:var(--l3)}
/* значок: тонкая линия цветом категории; кружок-подложка — в строках записей и над клавиатурой */
.ic,.badge{display:inline-grid;place-items:center}
.ic svg,.badge svg{width:100%;height:100%;display:block}
.badge{width:34px;height:34px;border-radius:50%;flex:none;padding:7px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.quick button{display:inline-flex;align-items:center;gap:6px}
.quick button .ic{width:17px;height:17px;color:var(--c)}
.cb .t span:first-child{display:inline-flex;align-items:center;gap:8px}
.cb .t .ic{width:18px;height:18px;color:var(--c)}
.icpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px;max-height:190px;overflow-y:auto}
.icpick button{height:44px;border-radius:12px;display:grid;place-items:center;color:var(--l2)}
.icpick button .ic{width:24px;height:24px}
.icpick button.on{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);outline:1.5px solid var(--c)}
html[data-style="rich"] .cat .ic{width:26px;height:26px}
.cat.more{background:var(--fill);color:var(--l2)}
.cat:active{transform:scale(.97)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keys button{height:clamp(46px,7.2vh,60px);font-size:24px;border-radius:12px;font-weight:350}
.keys button:active{background:var(--fill2)}
.keys .k-sm{font-size:18px;color:var(--l2)}

/* ── обзор ── */
.over{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);
  transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:5}
.over.open{transform:none}
.ohead{padding:max(10px,var(--l-sat, 0px)) 16px 12px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.mrow{display:flex;align-items:center;justify-content:space-between}
.mrow h1{font-size:22px;font-weight:600;margin:0}
.mrow button{width:44px;height:44px;font-size:22px;color:var(--l2);border-radius:12px}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;cursor:pointer}
.totals div{font-size:12px;color:var(--l2)}
.totals b{display:block;font-size:18px;font-weight:550;color:var(--ink);margin-top:2px}
.budget{margin-top:12px;font-size:13px;color:var(--l2)}
.bar{height:6px;border-radius:3px;background:var(--fill2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tint);border-radius:3px}
.bar i.over{background:var(--red)}
.link{color:var(--tint);font-size:13px;padding:8px 0}
.list{flex:1;overflow-y:auto;padding:0 0 110px}
.day{display:flex;justify-content:space-between;padding:16px 16px 6px;font-size:13px;color:var(--l2);position:sticky;top:0;background:var(--bg);z-index:1}
.rowwrap{position:relative;overflow:hidden;background:var(--red)}
.rowwrap::after{content:"Удалить";position:absolute;right:18px;top:50%;transform:translateY(-50%);color:#fff;font-size:14px}
.row{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:0 16px;min-height:58px;background:var(--bg);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.row .badge{width:36px;height:36px}
.row .nm{flex:1;min-width:0}
.row .nm small{display:block;color:var(--l3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sum{font-size:16px}
.empty-m{text-align:center;color:var(--l3);padding:60px 20px;font-size:15px}
.fab{position:absolute;left:50%;bottom:max(20px,var(--l-sab, 0px));transform:translateX(-50%);width:64px;height:64px;border-radius:50%;
  background:var(--tint);color:var(--on-tint);font-size:34px;font-weight:300;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:3}

/* ── шторка ── */
.wrap{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end}
.wrap .bg{position:absolute;inset:0;background:rgba(0,0,0,.35);animation:fade .2s}
.sheet{position:relative;width:100%;max-height:88%;overflow-y:auto;background:var(--cell);border-radius:18px 18px 0 0;
  padding:8px 16px max(20px,var(--l-sab, 0px));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--fill2);margin:0 auto 10px}
.sheet h2{font-size:18px;margin:4px 0 14px;font-weight:600}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
.allcats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.allcats .cat{background:var(--fill);height:70px;font-size:13.5px;padding:6px}
.allcats .cat.on{outline:2px solid var(--tint)}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:12px;color:var(--l2);margin-bottom:4px}
.f input{width:100%;font:inherit;font-size:17px;padding:12px;border-radius:12px;border:1px solid var(--sep);background:var(--bg);color:var(--ink)}
.btns{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;height:48px;border-radius:14px;background:var(--fill);font-size:16px}
.btn.main{background:var(--tint);color:var(--on-tint)}
.btn.del{color:var(--red)}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:400;color:var(--l2);text-align:right;padding:6px 4px;font-size:12px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:10px 4px;border-top:1px solid var(--sep)}
.tbl tr.yr td{color:var(--l3);font-size:12px;border:0;padding-top:16px}
.cb{margin-bottom:14px}
.cb .t{display:flex;justify-content:space-between;font-size:15px;margin-bottom:5px}
.cb .t span:last-child{color:var(--l2)}
.cb .bar i{background:var(--c)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px}
.cal .wd{text-align:center;color:var(--l3);padding:4px 0}
.cal .d{min-height:54px;border-radius:8px;background:var(--fill);padding:4px;display:flex;flex-direction:column;gap:1px;overflow:hidden}
.cal .d b{font-weight:500;font-size:13px}
.cal .d.has{cursor:pointer}
.cal .d.today{outline:1.5px solid var(--tint)}
.cal .d span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:absolute;left:12px;right:12px;bottom:max(16px,var(--l-sab, 0px));z-index:30;background:var(--ink);color:var(--bg);
  border-radius:14px;padding:0 6px 0 16px;min-height:52px;display:flex;align-items:center;justify-content:space-between;animation:up .22s}
.toast button{color:var(--tint);padding:14px 12px;font-weight:600;filter:brightness(1.15)}
.hint{font-size:12px;color:var(--l3);text-align:center;margin-top:16px;line-height:1.5}
</style>
</head>
<body>
<div id="app"></div>
<!--SCRIPT-->
</body>
</html>
