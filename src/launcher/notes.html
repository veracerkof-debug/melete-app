<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Блокнот</title>
<style>
:root{--l-sat:env(safe-area-inset-top,0px);--l-sab:env(safe-area-inset-bottom,0px);--bg:#F3F2EE;--cell:#FFFFFF;--ink:#161514;--l2:rgba(22,21,20,.62);--l3:rgba(22,21,20,.38);--sep:rgba(22,21,20,.10);
  --fill:rgba(22,21,20,.06);--fill2:rgba(22,21,20,.11);--tint:#E07A2E;--on-tint:#fff;--red:#C8483F;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:Georgia,"Times New Roman",serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121110;--cell:#1C1B19;--ink:#F3F2EE;--l2:rgba(243,242,238,.62);
  --l3:rgba(243,242,238,.36);--sep:rgba(243,242,238,.10);--fill:rgba(243,242,238,.07);--fill2:rgba(243,242,238,.13);
  --tint:#EE8A3C;--red:#E0675E;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* текст не выделяется — только там, где печатают */
html{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* чёрно-белый вид главного экрана: без цвета (значки категорий, суммы, акцент) */
html[data-mono] #app{filter:grayscale(1)}
input,textarea,[contenteditable="true"]{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none}
body{display:flex;justify-content:center}
#app{width:100%;max-width:560px;height:calc(100dvh / var(--l-auto,1));position:relative;overflow:hidden;zoom:var(--l-auto,1)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.bar{display:flex;align-items:center;gap:6px;min-height:52px;padding:max(8px,var(--l-sat, 0px)) 10px 4px}
.bar .ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--l2);font-size:22px;flex:none}
.bar .ib:active{background:var(--fill)}
.bar .ib.on{color:var(--tint)}
.bar h1{flex:1;margin:0;font-size:20px;font-weight:600}
.q{margin:4px 16px 8px;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:1px solid var(--sep);background:var(--cell);color:var(--ink);outline:none}
.q:focus{border-color:var(--ink)}
.hint{font-size:12px;color:var(--l3);margin:-2px 18px 6px;min-height:15px}
.tags{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 8px;scrollbar-width:none;flex:none}
.tags::-webkit-scrollbar{display:none}
.tag{flex:none;border:1px solid var(--sep);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--l2)}
.tag.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{flex:1;overflow-y:auto;padding:0 0 110px}
.rowwrap{position:relative}
.row{position:relative;z-index:1;display:block;width:100%;text-align:left;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--fill);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.row b{display:flex;gap:6px;align-items:baseline;font-size:17px;font-weight:550}
.row b i{font-style:normal;color:var(--tint);font-size:12px}
.row small{display:block;color:var(--l2);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row em{font-style:normal;color:var(--l3);font-size:11px;float:right;margin-left:8px}
.empty{text-align:center;color:var(--l3);padding:60px 24px;font-size:15px;line-height:1.5}
.fab{position:absolute;right:20px;bottom:max(20px,var(--l-sab, 0px));width:60px;height:60px;border-radius:50%;
  background:var(--tint);color:var(--on-tint);font-size:32px;font-weight:300;box-shadow:0 6px 18px rgba(0,0,0,.18)}
/* заметка */
.ed{flex:1;width:100%;border:0;outline:none;resize:none;background:transparent;color:var(--ink);font:inherit;font-size:17px;line-height:1.55;padding:6px 18px 24px}
.tools{display:flex;gap:4px;overflow-x:auto;padding:6px 10px max(8px,var(--l-sab, 0px));border-top:1px solid var(--sep);background:var(--bg);scrollbar-width:none;flex:none}
.tools button{flex:none;min-width:44px;height:40px;padding:0 10px;border-radius:10px;font-size:15px;color:var(--l2)}
.tools button:active{background:var(--fill)}
.read{flex:1;overflow-y:auto;padding:4px 18px 120px;font-size:17px;line-height:1.55;overflow-wrap:anywhere}
.read h1,.read h2,.read h3{font-family:var(--serif);font-weight:500;line-height:1.2;margin:14px 0 6px}
.read h1{font-size:28px;margin-top:4px}.read h2{font-size:22px}.read h3{font-size:19px}
.read p{margin:0 0 8px}
.read ul{margin:0 0 8px;padding-left:22px}
.read li.task{list-style:none;margin-left:-22px;display:flex;gap:10px;align-items:flex-start}
.read li.task input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--tint);flex:none}
.read li.task.done span{color:var(--l3);text-decoration:line-through}
.read a{color:var(--tint);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--tint) 40%,transparent)}
.read a.miss{opacity:.6;border-bottom-style:dashed}
.read .ht{color:var(--tint);font-size:.92em}
.read pre.mono{font-family:ui-monospace,"SF Mono","Roboto Mono",monospace;font-size:15px;line-height:1.45;background:var(--fill);border-radius:10px;padding:10px 12px;margin:0 0 10px;overflow-x:auto;white-space:pre}
.read p.chords{display:flex;flex-wrap:wrap;align-items:flex-end;margin:0 0 6px;line-height:1.3}
.read .cs{display:inline-flex;flex-direction:column;white-space:pre}
.read .cs b{min-height:1.2em;font-size:.82em;font-weight:650;color:var(--tint);padding-right:.35em}
.read code{background:var(--fill);border-radius:5px;padding:1px 5px;font-size:.9em}
.read blockquote{margin:0 0 8px;padding-left:12px;border-left:3px solid var(--sep);color:var(--l2)}
.read hr{border:0;border-top:1px solid var(--sep);margin:14px 0}
.back{margin-top:28px;padding-top:12px;border-top:1px solid var(--sep)}
.back div{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--l3);margin-bottom:6px}
.back button{display:block;padding:6px 0;color:var(--tint);font-size:15px}
.meta{font-size:12px;color:var(--l3);padding:0 18px 4px}
.wrap{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end}
.wrap .bg{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.sheet{position:relative;width:100%;background:var(--cell);border-radius:18px 18px 0 0;padding:10px 8px max(14px,var(--l-sab, 0px));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet button{display:block;width:100%;text-align:left;padding:15px 14px;font-size:16px;border-radius:12px}
.sheet button:active{background:var(--fill)}
.sheet .del{color:var(--red)}
@keyframes up{from{transform:translateY(100%)}}
.toast{position:absolute;left:12px;right:12px;bottom:max(16px,var(--l-sab, 0px));z-index:30;background:var(--ink);color:var(--bg);
  border-radius:14px;padding:0 6px 0 16px;min-height:52px;display:flex;align-items:center;justify-content:space-between;animation:up .22s}
.toast button{color:var(--tint);padding:14px 12px;font-weight:600;filter:brightness(1.15)}
</style>
</head>
<body>
<div id="app"></div>
<!--SCRIPT-->
</body>
</html>
